# Default ./configure flags per component (bash; sourced by ./gsm).
#
# Do not edit this file for machine-specific needs. Instead create
# config/build.local.conf (git-ignored) and override entries there, e.g.:
#
#   CONFIGURE_FLAGS[osmo-trx]="--with-lms"
#   CONFIGURE_FLAGS[libosmocore]+=" --disable-pcsc"
#
# All components are configured with --prefix=$GSM_PREFIX automatically.

CONFIGURE_FLAGS[libosmocore]=""
CONFIGURE_FLAGS[libosmo-netif]=""
# DAHDI is only needed for E1/T1 cards (classic Abis); most setups use Abis/IP.
CONFIGURE_FLAGS[libosmo-abis]="--disable-dahdi"
CONFIGURE_FLAGS[libosmo-sigtran]=""
CONFIGURE_FLAGS[osmo-mgw]=""
CONFIGURE_FLAGS[osmo-hlr]=""
# SMPP (--enable-smpp) needs libsmpp34, 3G (--enable-iu) needs osmo-iuh + libasn1c;
# neither is part of this workspace, so both stay at their upstream default (off).
CONFIGURE_FLAGS[osmo-msc]=""
CONFIGURE_FLAGS[osmo-bsc]=""
# osmo-bts-trx is the backend that talks to osmo-trx (SDR). osmo-bts-virtual is always built.
CONFIGURE_FLAGS[osmo-bts]="--enable-trx"
# Pick the SDR driver that matches your hardware:
#   --with-uhd (Ettus USRP B2xx/X3xx)   --with-lms (LimeSDR)   --with-bladerf (bladeRF 2.0)
#   --with-ipc (shared-memory driver interface, no extra library)
# Multi-ARFCN (default on) additionally requires fftw3f.
CONFIGURE_FLAGS[osmo-trx]="--with-uhd"
