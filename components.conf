# Osmocom component manifest -- the single source of truth for the ./gsm tool.
#
# One line per component, in BUILD ORDER (each line may depend only on lines above it;
# `./gsm order` derives the real dependencies from the sources and refuses a wrong order).
# The commit actually checked out is the submodule gitlink recorded in the gsm repo;
# `./gsm verify` checks that the gitlink matches the release tag (or full commit id) named here.
#
# Optional 5th column: comma-separated subdirectories that are separate autotools projects
# (built in that order). Default: the repository root.
#
