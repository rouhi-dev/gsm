name: build

# Builds the pinned workspace from scratch on a stock Ubuntu runner, then runs the workspace checks
# and the core-network smoke test. Triggered on every push/PR and manually (optionally with unit tests).
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      unit_tests:
        description: "Also run each component's unit tests (make check)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash   # = bash --noprofile --norc -eo pipefail, so a failure before | tee still fails the step
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4          # submodules are handled by ./gsm init

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config python3 sqlite3 \
            libtalloc-dev libsctp-dev libsqlite3-dev libgnutls28-dev libmnl-dev \
            libpcsclite-dev libusb-1.0-0-dev liburing-dev libortp-dev libfftw3-dev \
            libuhd-dev libboost-dev

      - name: Enable kernel SCTP (osmo-msc SGs listener, libosmocore SCTP tests)
        run: sudo modprobe sctp || echo "::warning::sctp module unavailable; smoke test will report it"

      - name: Initialise submodules (forks)
        run: ./gsm init

      - name: Check prerequisites
        run: ./gsm doctor

      - name: Build
        run: |
          mkdir -p _build/ci
          ./gsm build ${{ inputs.unit_tests && '--check' || '' }} 2>&1 | tee _build/ci/build.out

      - name: Verify workspace
        run: ./gsm verify --build 2>&1 | tee _build/ci/verify.out

      - name: Core-network smoke test
        run: tests/smoke-core.sh 2>&1 | tee _build/ci/smoke.out

      # Surface the tool's [FAIL] lines (and the log excerpts it prints) as annotations, so the reason
      # is visible on the run page and through the API without downloading logs.
      - name: Annotate failures
        if: failure()
        run: |
          for f in _build/ci/*.out; do
            [ -f "$f" ] || continue
            msg="$(grep -E '^\[FAIL\]|^ +\| |^ +-> ' "$f" | head -n 40 | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')"
            [ -n "$msg" ] && echo "::error title=$(basename "$f" .out) failed::$msg"
          done
          for f in _build/logs/*.log; do
            [ -f "$f" ] || continue
            if grep -qE '^configure: error|\*\*\* \[' "$f"; then
              msg="$(grep -nE '^configure: error|error:|\*\*\* \[' "$f" | head -n 12 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
              echo "::error title=$(basename "$f")::$msg"
            fi
          done

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: _build/logs/
