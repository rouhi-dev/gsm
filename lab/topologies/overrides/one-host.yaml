# Site override: run the three-node topologies on ONE machine. Each "node" keeps its identity but is
# local, with its own loopback address (Linux answers on all of 127.0.0.0/8 without configuration).
# Every service binds to its node's address, so this exercises the same cross-node endpoints as real
# BBUs -- except the physical network between them.
#
#   gsm-lab -f lab/topologies/multi-bsc.yaml -o lab/topologies/overrides/one-host.yaml validate
nodes:
  node-01: { host: localhost, address: 127.0.1.1, addresses: { addr2: 127.0.1.2 }, ssh: null }
  node-02: { host: localhost, address: 127.0.2.1, addresses: { addr2: 127.0.2.2 }, ssh: null }
  node-03: { host: localhost, address: 127.0.3.1, addresses: { addr2: 127.0.3.2 }, ssh: null }
